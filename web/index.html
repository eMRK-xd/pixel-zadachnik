<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Пиксельный задачник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* Pixelify Sans (OFL) with lowercase ь ъ ы brought down to x-height, shipped with the app: web/fonts/ */
@font-face{font-family:"Pixelify Zadachnik";src:url(fonts/PixelifyZadachnik-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Pixelify Zadachnik";src:url(fonts/PixelifyZadachnik-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Pixelify Zadachnik";src:url(fonts/PixelifyZadachnik-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#140b24; --bg2:#1d1233; --panel:#251843; --line:#3b2766; --ink:#efe3c2; --dim:#a493c9;
  --gold:#c9962b; --gold-d:#7d5a14; --px:4px;
  --ff:"Pixelify Zadachnik", ui-monospace, monospace;
  font-family:var(--ff);
}
body.f-alt{-webkit-font-smoothing:auto}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button:focus:not(:focus-visible),[tabindex]:focus:not(:focus-visible){outline:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:none}
body{background-image:linear-gradient(var(--bg2) 2px,transparent 2px),linear-gradient(90deg,var(--bg2) 2px,transparent 2px);background-size:24px 24px;overflow:hidden}
button,input{font:inherit;color:inherit}
svg.spr{image-rendering:pixelated;shape-rendering:crispEdges;flex:none}

/* pixel frame: notched corners via box-shadow */
.px{position:relative;background:var(--panel);
  box-shadow:0 calc(-1*var(--px)) 0 0 var(--c,var(--line)),0 var(--px) 0 0 var(--c,var(--line)),
  calc(-1*var(--px)) 0 0 0 var(--c,var(--line)),var(--px) 0 0 0 var(--c,var(--line)),
  inset 0 calc(-1*var(--px)) 0 0 rgba(0,0,0,.35), inset 0 var(--px) 0 0 rgba(255,255,255,.06)}
.btn{--c:var(--gold-d);background:#3a2a17;color:#f3d48a;border:0;padding:6px 12px;cursor:pointer;margin:4px}
.btn:hover{background:#4a3519}
.btn:active{transform:translateY(2px)}
.btn.on{background:var(--gold);color:#1a0f05}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#f3d48a;letter-spacing:1px}
.date{color:var(--dim);font-size:13px}
.xp{display:flex;align-items:center;gap:8px;margin-left:auto}
.xpbar{--c:#5b3f8f;width:160px;height:14px;background:#120a20;padding:0}
.xpfill{height:100%;background:repeating-linear-gradient(90deg,#e0b13e 0 8px,#c9962b 8px 12px);transition:width .3s steps(6)}
.xp small{color:var(--dim)}

/* board mode */
#app{height:100%;display:flex;flex-direction:column}
.board{flex:1;display:flex;gap:18px;padding:10px 22px 14px;overflow-x:auto;min-height:0}
.col{--c:var(--cc);flex:0 0 260px;display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--cc) 10%,#1b1130);margin:4px}
.colhead{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;background:color-mix(in srgb,var(--cc) 30%,#1b1130);font-weight:700;letter-spacing:.5px;cursor:default;user-select:none}
.colhead .cnt{margin-left:auto;font-size:12px;background:#0006;padding:1px 6px;color:var(--cc)}
.colhead .tog{display:none;margin-left:6px;color:var(--dim)}
.list{flex:1;overflow-y:auto;padding:10px 10px 4px;min-height:40px}
.list.over{background:color-mix(in srgb,var(--cc) 12%,transparent)}
.add{display:flex;padding:6px 10px 10px}
.add input{flex:1;min-width:0;background:#0d0718;border:0;padding:6px 8px;outline:none;--c:#3b2766;color:var(--ink)}
.add input::placeholder{color:#6d5d94}

/* cards */
.card{--c:color-mix(in srgb,var(--cc) 55%,#000);display:flex;gap:8px;align-items:flex-start;background:#2a1c48;padding:8px 8px 8px 6px;margin:4px 4px 12px;cursor:grab;user-select:none;transition:transform .08s}
@media (hover:hover){.card:hover{transform:translate(-1px,-2px);background:#33225a}} /* phones keep a tapped card "hovered"; no hover look there */
.card.dragging{opacity:.35}
.card.done .txt{text-decoration:line-through;color:#7f71a6}
.card.done{background:#1f1538}
.chk{flex:none;width:16px;height:16px;margin-top:1px;background:#0d0718;cursor:pointer;box-shadow:inset 0 0 0 2px var(--cc)}
.card.done .chk{background:var(--cc);box-shadow:inset 0 0 0 2px var(--cc),inset 0 0 0 5px #0d0718}
.body{flex:1;min-width:0}
.txt{line-height:1.25;word-wrap:break-word;outline:none}
.meta{display:flex;gap:6px;margin-top:5px;align-items:center;flex-wrap:wrap}
.src{font-size:11px;padding:0 5px;background:#0007;color:var(--dim)}
.src.gc{color:#9fe0a8}.src.yg{color:#8fd0ff}.src.nt{color:#ffffff}.src.dl{color:#f3d48a}.src.ob{color:#c79bff}.src.ai{color:#f0a07a}
.when{font-size:11px;color:#6d5d94}
.del{opacity:0;border:0;background:none;color:#9b5a6e;cursor:pointer;padding:0 2px;font-size:14px}
.card:hover .del{opacity:1}
.ph{height:34px;margin:4px 4px 12px;border:2px dashed var(--cc);opacity:.6}
/* subtasks, description, assignees */
.prog{display:inline-flex;gap:1px;align-items:center;font-size:11px;color:var(--dim)}
.prog i{width:4px;height:7px;background:#0009;box-shadow:inset 0 0 0 1px #ffffff1a}
.prog i.f{background:var(--cc);box-shadow:none}
.prog b{font-weight:400;margin-left:4px}
.who{font-size:11px;color:#6d5d94}
.ext{font-size:10px;color:#6d5d94;letter-spacing:.5px}
.card.ready,body.loop .card.ready{--c:#e7c56a}
.card.due-today,body.loop .card.due-today{--c:#e0a24a}
.card.due-late,body.loop .card.due-late{--c:#c4566a}
body:not(.loop) .card.due-today{background:#3a2a17}body:not(.loop) .card.due-late{background:#3a1a24}
body.loop .card.due-today{background:linear-gradient(#1c150a,#0d0905)}
body.loop .card.due-late{background:linear-gradient(#1e0c12,#0d0508)}
.subs li.today .st{color:#f0b45a}.subs li.late .st{color:#f08a9a}
.det .open,.subs .open{font-size:11px;color:#6fc3d9;text-decoration:none}
.det .open:hover,.subs .open:hover{color:#fff}
.rdy{font-size:11px;padding:0 5px;background:#e7c56a;color:#1a0f05;animation:rdy 1.4s steps(2) infinite}
@keyframes rdy{50%{background:#b4862e}}
.card.exp{cursor:default}
.det{margin-top:8px;padding-top:7px;border-top:2px dashed #ffffff1c;cursor:default;user-select:text}
.det .dhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.from{font-size:10px;color:#8a7a5a;letter-spacing:.5px}
.det textarea{width:100%;min-height:40px;background:#0007;border:0;color:var(--ink);font:inherit;font-size:13px;padding:5px 6px;resize:vertical;outline:none;display:block}
.det textarea::placeholder{color:#5a6a80}
.subs{list-style:none;margin:6px 0 0;padding:0}
.subs li{display:flex;gap:7px;align-items:flex-start;padding:3px 0;font-size:13px;line-height:1.25}
.subs .sc{flex:none;width:12px;height:12px;margin-top:2px;background:#0009;box-shadow:inset 0 0 0 2px var(--cc);cursor:pointer}
.subs li.done .sc{background:var(--cc);box-shadow:inset 0 0 0 2px var(--cc),inset 0 0 0 4px #060910}
.subs li.done .st{text-decoration:line-through;color:#5a6a80}
.subs .swr{flex:1;min-width:0}
.subs .st{word-wrap:break-word;outline:none}
.subs .sm{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:2px}
.subs .sm:empty{display:none}
.sb{opacity:0;border:0;background:none;color:var(--dim);cursor:pointer;padding:0 1px;font-size:11px}
.subs li:hover .sb{opacity:1}
.subadd{display:flex;margin-top:4px}
.subadd input{flex:1;min-width:0;background:#0007;border:0;padding:4px 6px;outline:none;color:var(--ink);font-size:13px}
.subadd input::placeholder{color:#5a6a80}
.mv{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;align-items:center;font-size:11px;color:var(--dim)}
.mv button{border:0;background:#0008;color:var(--cc2);cursor:pointer;font-size:11px;padding:1px 6px}
.mv button:hover{background:#000}

/* daily log */
#app{position:relative}
.daily{--c:#7d5a14;position:absolute;left:26px;bottom:18px;z-index:5;background:#22170f;padding:8px 14px;display:flex;gap:16px;align-items:flex-start;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.7))}
.daily h3{cursor:pointer;user-select:none}
.daily .arr{color:var(--gold)}
.daily .dcnt{font-size:11px;background:#0007;padding:0 5px;color:var(--dim)}
.daily:not(.open) ul{display:none}
.daily.open{right:26px;animation:unfold .34s cubic-bezier(.2,.8,.2,1)}
.daily ul{max-height:40vh}
@keyframes unfold{from{clip-path:inset(100% -20px -20px -20px);transform:translateY(6px);opacity:.5}to{clip-path:inset(-20px -20px -20px -20px);transform:none;opacity:1}}
.daily.open li{animation:rise .38s cubic-bezier(.2,.8,.2,1) backwards}
.daily.open li:nth-child(2){animation-delay:.04s}.daily.open li:nth-child(3){animation-delay:.08s}.daily.open li:nth-child(4){animation-delay:.12s}.daily.open li:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* settings drop down from the gear the same way the daily panel unfolds upwards */
.settings.open{animation:unfoldD .34s cubic-bezier(.2,.8,.2,1)}
@keyframes unfoldD{from{clip-path:inset(-20px -20px 100% -20px);transform:translateY(-6px);opacity:.5}to{clip-path:inset(-20px -20px -20px -20px);transform:none;opacity:1}}
.settings.opening .sg{animation:dropIn .38s cubic-bezier(.2,.8,.2,1) backwards}
.settings.opening .sg:nth-child(2){animation-delay:.04s}.settings.opening .sg:nth-child(3){animation-delay:.08s}.settings.opening .sg:nth-child(4){animation-delay:.12s}.settings.opening .sg:nth-child(n+5){animation-delay:.16s}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
body.anim-fast .settings.open,body.anim-fast .settings.opening .sg,body.anim-fast .daily.open,body.anim-fast .daily.open li{animation-duration:.16s;animation-delay:0s}
body.anim-off .settings.open,body.anim-off .settings.opening .sg,body.anim-off .daily.open,body.anim-off .daily.open li{animation:none}
/* the card answers the touch in the same frame: a pixel lower and a little lighter, before anything opens */
.card:active:not(:has(.det:active,button:active,.chk:active)){transform:translateY(1px);transition:none}
.card:active:not(:has(.det:active,button:active,.chk:active))::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.05);pointer-events:none} /* a shade lighter than whatever the card is */
.board{padding-bottom:calc(70px + var(--dockh,0px))}
#moddock{position:absolute;right:26px;bottom:64px;z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
#moddock:empty{display:none}
.modtile{--c:var(--line);padding:0;pointer-events:auto;background:var(--panel);filter:drop-shadow(6px 8px 0 rgba(0,0,0,.7));animation:rise .38s cubic-bezier(.2,.8,.2,1)}
.modtile iframe{display:block;border:0;width:100%;height:100%;background:transparent;color-scheme:normal}
body.loop .modtile{--c:#24344a;background:#06080c}
body.vcal #moddock{display:none}
.daily h3{margin:0;color:#f3d48a;font-size:15px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.daily ul{list-style:none;margin:0;padding:0;columns:2;column-gap:28px;flex:1;overflow:auto}
.daily li{break-inside:avoid;padding:2px 0;color:#e8d6a8;display:flex;gap:6px}
.daily li::before{content:"▪";color:var(--gold)}
.daily li button{border:0;background:none;color:#8a6a2a;cursor:pointer;padding:0;margin-left:auto}
.daily li button:hover{color:#f3d48a}

/* juice */
#fx{position:fixed;inset:0;pointer-events:none;z-index:8;image-rendering:pixelated}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.06,.9)}60%{transform:scale(.97,1.05)}100%{transform:scale(1)}}
@keyframes flash{0%,40%{background:#f3d48a}100%{}}
.card.pop{animation:pop .28s steps(4)}
.card.pop .chk{animation:flash .3s steps(3)}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
#app.shake{animation:shake .25s steps(4)}
@keyframes land{0%{transform:translateY(-6px)}50%{transform:translateY(2px)}100%{transform:none}}
.card.land{animation:land .2s steps(3)}

/* ===== LOOP theme: night sky from the Steam banner + gold frames ===== */
body.loop{--bg:#000;--bg2:#050608;--panel:#06080c;--line:#24344a;--ink:#e8dfc8;--dim:#8b9bb0;--gold:#d4a640;--gold-d:#6e4f1c;background-color:var(--bg)}
body.loop .logo,body.loop .daily h3{color:#e7c56a;text-shadow:2px 2px 0 #3a2410}
body.loop .btn{background:#0b1019;color:#e7c56a}
body.loop .btn:hover{background:#121a28}
body.loop .btn.on{background:#d4a640;color:#1a0f05}
body.loop .xpbar{--c:#6e4f1c;background:#060910}
body.loop .xpfill{background:repeating-linear-gradient(90deg,#e7c56a 0 8px,#b4862e 8px 12px)}
body.loop .col{--c:#22324a;background:#030406}
body.loop .colhead{background:linear-gradient(#0b111b,#06080c);border-bottom:2px solid var(--cc);color:#e9dbb7}
body.loop .colhead .cnt{color:#e7c56a}
body.loop .add input{background:#060910;--c:#22324a}
body.loop .add input::placeholder{color:#5a6a80}
/* golden card frame: outer dark-gold notched border + inner bright gold hairline + column-tinted top band */
body.loop .card{--c:#7a5a22;background:linear-gradient(#0c121c,#06090e);
  box-shadow:0 -4px 0 0 var(--c),0 4px 0 0 var(--c),-4px 0 0 0 var(--c),4px 0 0 0 var(--c),
  inset 0 0 0 2px #000,inset 0 0 0 4px #c99b3f,inset 0 6px 0 0 color-mix(in srgb,var(--cc) 55%,#000),inset 0 -6px 0 0 #000;
  padding:12px 10px 12px 10px}
@media (hover:hover){body.loop .card:hover{background:linear-gradient(#131c2b,#0a0f17)}}
body.loop .card.done{--c:#22324a;background:#030406;box-shadow:0 -4px 0 0 var(--c),0 4px 0 0 var(--c),-4px 0 0 0 var(--c),4px 0 0 0 var(--c),inset 0 0 0 2px #000,inset 0 0 0 4px #2c3d55}
body.loop .card.done .txt{color:#5a6a80}
body.loop .chk{background:#060910}
body.loop .src{background:#060910}
body.loop .when{color:#6a7a90}
body.loop .src.nt{color:#e9dbb7}.src.yg{}body.loop .src.yg{color:#7fb0a8}body.loop .src.ob{color:#c49a6c}
body.loop .daily{--c:#6e4f1c;background:#050608}
body.loop .daily li{color:#d9cfb4}
body.loop.strip #app{border-left-color:#6e4f1c}
body.loop.strip .desk{background:radial-gradient(circle at 30% 40%,#070b12,#000 70%);color:#22324a}
body.loop .toast{--c:#d4a640;background:#06080c;color:#e7c56a}

body.loop .src.yg{color:#6fc3d9}body.loop .xpfill{background:repeating-linear-gradient(90deg,#e0a24a 0 8px,#c06a2c 8px 12px)}
body.loop{background-image:radial-gradient(#6fc3d933 1px,transparent 1.5px),radial-gradient(#ffffff1c 1px,transparent 1.5px);background-size:97px 89px,151px 137px;background-position:0 0,40px 60px}
/* CRT: scanlines + vignette + faint flicker */
#crt{position:fixed;inset:0;pointer-events:none;z-index:7;display:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);
  animation:flick 4s steps(2) infinite}
body.crt #crt{display:block}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.85}}
/* ===== desktop app mode (Electron) ===== */
.winbtns{display:none;margin-left:auto}
body.app .winbtns{display:inline-flex}
body.app .desk,body.app .modebtns{display:none!important}
body.app.strip #app{position:fixed;inset:0;width:auto}
body.app .top{-webkit-app-region:drag}
body.app .top button,body.app .top input,body.app .xp,body.app #logoSpr,body.app .settings{-webkit-app-region:no-drag}
.winbtns .btn{padding:4px 9px}
body.app .top .btn.ico{width:30px;height:28px;padding:0;margin:4px;display:inline-flex;align-items:center;justify-content:center;--hl:#fff4cf}
body.app .top .btn.ico.on{--hl:#8a6a2a}
.ico svg{image-rendering:pixelated;shape-rendering:crispEdges}
.report{display:inline-flex;align-items:center;gap:7px;--hl:#fff4cf}.report .ri{display:inline-flex}.report svg{image-rendering:pixelated;shape-rendering:crispEdges;display:block}
body:not(.app) #setb.ico{width:28px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;--hl:#fff4cf}
#pinb.on svg{transform:translateY(7px)}
#pinb.stab svg{animation:pinStab .62s linear}#pinb.stab{animation:pinJolt .62s linear}
#pinb.pull svg{animation:pinPull .3s steps(5)}
@keyframes pinStab{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.45,0,.55,1)}45%{transform:translateY(-4px);animation-timing-function:cubic-bezier(.7,0,1,.6)}66%{transform:translateY(9px) scaleY(.88);animation-timing-function:ease-out}80%{transform:translateY(6px)}100%{transform:translateY(7px)}}
@keyframes pinJolt{0%,64%{transform:none}68%{transform:translateY(2px)}76%{transform:translateY(-1px)}84%,100%{transform:none}}
@keyframes pinPull{0%{transform:translateY(7px)}45%{transform:translateY(-5px)}100%{transform:translateY(0)}}

/* ===== settings popover, weekly goals, report ===== */
.top{position:relative}
#setb.on{background:var(--gold);color:#1a0f05}
.settings{--c:var(--line);display:none;position:absolute;top:calc(100% - 4px);right:18px;z-index:20;flex-wrap:wrap;gap:2px;padding:8px;max-width:330px;background:var(--panel);filter:drop-shadow(6px 8px 0 rgba(0,0,0,.7))}
.settings.open{display:flex}
.goals{--c:#6e4f1c;margin:2px 26px 4px;padding:8px 12px;background:var(--panel);display:flex;gap:12px;align-items:flex-start}
.goals h4{margin:0;color:#e7c56a;white-space:nowrap;font-size:14px;display:flex;gap:6px;align-items:center}
.goals ol{margin:0;padding-left:20px;flex:1;columns:2;column-gap:24px;font-size:14px}
.goals li{break-inside:avoid;padding:1px 0}
.goals .empty{flex:1;color:var(--dim);font-size:13px}
.goals .stale{font-size:11px;color:#1a0f05;background:#e07a35;padding:0 5px;margin-left:4px}
.goals h4{cursor:pointer;user-select:none}
.goals .arr{color:var(--gold)}
.goals .dcnt{font-size:11px;background:#0007;padding:0 5px;color:var(--dim)}
.goals.closed{padding:5px 12px}
.goals .edit{border:0;background:none;color:var(--dim);cursor:pointer;font-size:14px;padding:0 2px}
.goals .edit:hover{color:#e7c56a}
.goals textarea{flex:1;min-height:90px;background:#060910;color:var(--ink);border:0;padding:6px 8px;font:inherit;font-size:14px;outline:none;resize:vertical}
.report{position:absolute;right:26px;bottom:18px;z-index:6;margin:0;padding:8px 14px;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.7))}
.daily.open{right:150px}
body.strip .goals{margin:2px 16px 4px;flex-direction:column;gap:4px}
body.strip .goals ol{columns:1}
body.strip .report{right:14px;bottom:14px;padding:6px 10px}
body.strip .daily.open{right:14px;bottom:56px}

/* view tabs + calendar */
.tabs{display:flex;gap:2px;padding:0 22px 4px}
.tabs .tab{border:0;background:none;color:var(--dim);cursor:pointer;padding:3px 10px 5px;display:flex;gap:6px;align-items:center;border-bottom:3px solid transparent;font-size:14px}
.tabs .tab:hover{color:var(--ink)}
.tabs .tab.on{color:#e7c56a;border-bottom-color:var(--gold)}
.tabs .tab small{font-size:10px;background:#c4566a;color:#fff;padding:0 4px}
body.strip .tabs{padding:0 12px 2px}
.cal{display:none;flex:1;overflow-y:auto;padding:6px 22px 20px;min-height:0}
body.vcal .cal{display:block}
body.vcal .board,body.vcal .goals,body.vcal .daily,body.vcal .report{display:none!important}
body.strip .cal{padding:6px 12px 20px}
.calsrc{--c:#22324a;margin:4px 4px 12px;padding:8px 10px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.calsrc b{color:#e7c56a}
.calsrc small{color:var(--dim);flex:1 1 0;min-width:0;font-size:11px}
.calsrc small.err{color:#e88}
.calsrc .btn{margin:0;padding:2px 8px}
.calhelp{width:100%;color:var(--dim);font-size:12px;line-height:1.4;margin-top:4px}

const REPORT_BLOCKS=["Цели на неделю","Я за сегодня","Не сделано","План на завтра"];
function tidyReport(txt,draft){ // keep only known blocks, in the right order; goals come verbatim from the draft
  const parse=t=>{const m={};let cur=null;t.split("\n").forEach(l=>{const h=REPORT_BLOCKS.find(b=>l.trim().replace(/:$/,"")===b);if(h){cur=h;m[h]=[];return}
    if(/^(заметки|черновик|ответ)/i.test(l.trim()))cur=null;else if(cur&&l.trim()&&!/^\d+(\.\d+)*\.?\s*\.{3}$/.test(l.trim()))m[cur].push(l.trimEnd())});return m};
  const ai=parse(txt),dr=parse(draft);
  if(dr["Цели на неделю"])ai["Цели на неделю"]=dr["Цели на неделю"];else delete ai["Цели на неделю"];
  REPORT_BLOCKS.forEach(b=>{if(!dr[b]&&b!=="Я за сегодня")delete ai[b]});
  REPORT_BLOCKS.forEach(b=>{if(dr[b]&&!(ai[b]&&ai[b].length))ai[b]=dr[b]}); // model dropped a block → keep the draft's
  const out=REPORT_BLOCKS.filter(b=>ai[b]&&ai[b].length).map(b=>b+"\n"+ai[b].join("\n")).join("\n\n");
  return out||draft;
}

  const block=(title,lines)=>lines.length?title+"\n"+lines.join("\n"):"";
  const dueTxt=t=>t.due&&!t.done?" - до "+new Date(t.due+"T00:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}):"";
  const group=(list,suffix="")=>{const out=[];let n=0;COLS.forEach(c=>{const ts=list.filter(t=>t.col===c.id);if(!ts.length)return;n++;
    if(ts.length===1)out.push(`${n}. ${c.name}: ${clean(ts[0].text)}${dueTxt(ts[0])}${suffix}`);
    else{out.push(`${n}. ${c.name}`);ts.forEach((t,i)=>out.push(`${n}.${i+1}. ${clean(t.text)}${dueTxt(t)}${suffix}`))}});return out};
  const done=[...S.tasks,...(S.archive||[])].filter(t=>t.done&&t.doneAt&&new Date(t.doneAt).toDateString()===today);
  const open=S.tasks.filter(t=>!t.done&&t.col!=="inbox");
  return [
    block("Цели на неделю",goalList().map((x,i)=>`${i+1}. ${clean(x)}`)),
    block("Я за сегодня",group(done)),
    block("Не сделано",group(open.filter(t=>t.when==="до дейлика")," - [причина]")),
    block("План на завтра",group(open.filter(t=>t.when!=="до дейлика"))),
  ].filter(Boolean).join("\n\n");
}
/* deadlines: t.due = "YYYY-MM-DD" */
const dueDays=d=>{const a=new Date(d+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)};
const dueLabel=d=>{const n=dueDays(d);if(n<0)return n===-1?"вчера":`${-n} дн. назад`;if(n===0)return"сегодня";if(n===1)return"завтра";
  return new Date(d+"T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short"}).replace(".","")};
const dueCls=d=>{const n=dueDays(d);return n<0?"late":n===0?"today":n<=2?"soon":""};
const gcalUrl=t=>{const a=t.due.replace(/-/g,""),e=new Date(t.due+"T00:00:00");e.setDate(e.getDate()+1);
  const b=e.getFullYear()+String(e.getMonth()+1).padStart(2,"0")+String(e.getDate()).padStart(2,"0");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t.text)+"&dates="+a+"/"+b+
    "&details="+encodeURIComponent("Дедлайн из пиксельного задачника"+(t.url?"\n"+t.url:""))};
const subProg=t=>{const a=t.subtasks||[];if(!a.length)return"";const d=a.filter(x=>x.done).length,n=Math.min(a.length,10),f=Math.round(d/a.length*n);
  return `<span class="prog" title="Подзадачи: ${d} из ${a.length}">${Array.from({length:n},(_,i)=>`<i class="${i<f?"f":""}"></i>`).join("")}<b>${d}/${a.length}</b></span>`};
const whoTxt=a=>a?.length?`<span class="who" title="Исполнители">@${esc(a.join(", "))}</span>`:"";
const dueBadge=(x,done)=>x.due?`<span class="due ${done?"":dueCls(x.due)}" data-due="${x.id}" title="Дедлайн ${x.due}">⏳ ${dueLabel(x.due)}</span>`:"";
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch{return"ссылка"}};
const FROMS={pc:"добавлена с ПК",phone:"добавлена с телефона",web:"добавлена на сайте",ai:"добавил Клод"};
const det=t=>{const a=t.subtasks||[];return `<div class="det">
  ${t.ext||t.assignees?.length||t.url||FROMS[t.from]?`<div class="dhead">${t.ext?`<span class="ext">${esc(t.ext)}</span>`:""}${FROMS[t.from]?`<span class="from" title="Где задача появилась">${FROMS[t.from]}</span>`:""}${whoTxt(t.assignees)}${t.url?`<a class="open" href="#" data-href="${esc(t.url)}" title="${esc(t.url)}">↗︎ ${esc(hostOf(t.url))}</a>`:""}</div>`:""}
  <textarea class="desc" data-desc="${t.id}" rows="2" placeholder="описание…">${esc(t.description||"")}</textarea>
  <ul class="subs">${a.map(x=>`<li class="${x.done?"done":""} ${!x.done&&x.due?dueCls(x.due):""}" data-sid="${x.id}"><span class="sc" title="Готово"></span><div class="swr"><div class="st">${esc(x.text)}</div>
    <div class="sm">${dueBadge(x,x.done)}${whoTxt(x.assignees)}${x.url?`<a class="open" href="#" data-href="${esc(x.url)}" title="${esc(x.url)}">↗︎</a>`:""}${x.due?"":`<button class="sb" data-due="${x.id}" title="Дедлайн">⏳</button>`}<button class="sb" data-promote="${x.id}" title="Вынести в отдельную задачу">⇱</button><button class="sb" data-sdel="${x.id}" title="Удалить подзадачу">✕</button></div></div></li>`).join("")}</ul>
  <form class="subadd" data-for="${t.id}"><input placeholder="+ подзадача" autocomplete="off"></form>
  <div class="mv">в:${COLS.filter(c=>c.id!==t.col).map(c=>`<button data-move="${c.id}" style="--cc2:${cc(c)}">${c.name}</button>`).join("")}</div>
</div>`};
/* unfold / fold a card's details without animating layout (that stutters on phones): only this card is redrawn and gets its
   final size at once; everything below it slides from where it was with transform, and the details fade in under it */
const detBusy=new Set();
function redrawCard(id){const t=S.tasks.find(z=>z.id===id),el=document.querySelector(`.card[data-id="${id}"]`);if(!t||!el)return null;
  const tmp=document.createElement("div");tmp.innerHTML=card(t);const n=tmp.firstElementChild;el.replaceWith(n);return n}
function below(el){const b=el.getBoundingClientRect().bottom-1,out=[];   // what sits under the card: later cards, the add field, later columns
  for(let n=el;n&&n.id!=="board";n=n.parentElement)for(let x=n.nextElementSibling;x;x=x.nextElementSibling)if(x.getBoundingClientRect().top>=b)out.push(x);
  return out}
/* S.anim (this device only): smooth | fast | off */
const ANIMS={smooth:"плавно",fast:"быстро",off:"выкл"};
async function animDet(id,open,swap){const el=document.querySelector(`.card[data-id="${id}"]`),A=ANIMS[S.anim]?S.anim:"smooth",k=A==="fast"?.5:1;
  if(!el||!el.animate||A==="off"){swap();return}
  if(open){const h0=el.offsetHeight,n=swap();if(!n?.animate)return;const d=n.querySelector(".det"),dh=n.offsetHeight-h0,ms=(MOBILE?240:300)*k,ez="cubic-bezier(.2,.8,.2,1)";
    below(n).forEach(x=>x.animate([{transform:`translateY(${-dh}px)`},{transform:"none"}],{duration:ms,easing:ez}));
    if(d){d.animate([{opacity:0},{opacity:1}],{duration:ms,easing:ez});
      if(A==="smooth")[...d.querySelectorAll(".dhead,.desc,.subs li,.subadd,.mv")].slice(0,7).forEach((r,i)=>r.animate([{opacity:0,transform:"translateY(5px)"},{opacity:1,transform:"none"}],
        {duration:260,delay:40+i*30,easing:ez,fill:"backwards"}))}
    return}
  const d=el.querySelector(".det");if(!d){swap();return}
  const dh=d.offsetHeight+parseFloat(getComputedStyle(d).marginTop||0),ms=(MOBILE?180:220)*k,ez="cubic-bezier(.5,0,.8,.4)";
  const fol=below(el).map(x=>x.animate([{transform:"none"},{transform:`translateY(${-dh}px)`}],{duration:ms,easing:ez,fill:"forwards"}));
  await d.animate([{opacity:1},{opacity:0}],{duration:ms,easing:ez,fill:"forwards"}).finished.catch(()=>{});
  swap();fol.forEach(x=>x.cancel())}                                          // the layout catches up in the same frame the slide ends
function toggleExp(id){if(detBusy.has(id))return;detBusy.add(id);SFX.play("pick");
  const open=!S.exp.includes(id);S.exp=open?[...S.exp,id]:S.exp.filter(z=>z!==id);save();
  animDet(id,open,()=>redrawCard(id)).finally(()=>detBusy.delete(id))}
const subDue=t=>{if(t.done)return"";let w="";for(const x of t.subtasks||[]){if(x.done||!x.due)continue;const c=dueCls(x.due);if(c==="late")return"late";if(c==="today")w="today"}return w};
const card=t=>{const ex=(S.exp||[]).includes(t.id),rd=isReady(t),dc=!t.done&&t.due?dueCls(t.due):"",sd=dc==="late"||dc==="today"?"":subDue(t);
  return `<div class="card px ${t.done?"done":""} ${rd?"ready":""} ${ex?"exp":""} ${dc==="late"?"due-late":dc==="today"?"due-today":""}" draggable="${ex?"false":"true"}" data-id="${t.id}">
  <div class="chk"></div>
  <div class="body"><div class="txt">${esc(t.text)}</div>
  <div class="meta"><span class="src ${t.src}" data-src="${t.id}" title="Источник задачи">${SRC[t.src]||t.src}${t.url?" ↗︎":""}</span>${dueBadge(t,t.done)}${subProg(t)}${sd?`<span class="due ${sd}" title="Подзадача с дедлайном">↳ ${sd==="late"?"просрочено":"сегодня"}</span>`:""}${rd?'<span class="rdy">можно закрывать</span>':""}${!ex&&t.description?'<span class="when" title="Есть описание">¶</span>':""}${t.when?`<span class="when">${t.when}</span>`:""}</div>
  ${ex?det(t):""}</div>
  ${t.due?"":`<button class="dueb" data-due="${t.id}" title="Поставить дедлайн">⏳</button>`}<button class="del" title="Удалить">✕</button></div>`};

/* ===== SFX: tiny chiptune synth (Web Audio, no files) ===== */
const SFX=(()=>{
  let ac,master,bright,bus,PAN=0;let lastArp=-1,lastEnd=-1;
  const init=()=>{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.26;
    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2400;lp.Q.value=.7; // muffled, warm
    const dl=ac.createDelay(),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.16;fb.gain.value=.32;wet.gain.value=.22; // short dark echo
    const dlf=ac.createBiquadFilter();dlf.type="lowpass";dlf.frequency.value=1200;
    master.connect(lp);lp.connect(ac.destination);lp.connect(dl);
    bright=ac.createGain();bright.gain.value=.26;bright.connect(ac.destination);bright.connect(dl); /* full-range bus (no low-pass), same echo */
    dl.connect(dlf).connect(fb).connect(dl);dlf.connect(wet).connect(ac.destination)}if(ac.state==="suspended")ac.resume();return ac};
  const out=g=>{const d=bus||master;if(PAN&&!S.mono&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,PAN));g.connect(p).connect(d)}else g.connect(d)}; // stereo

  const tone=(f,t,d,type="square",v=.5,f2,vb)=>{const o=ac.createOscillator(),g=ac.createGain();if(type==="pulse")o.setPeriodicWave(pulse());else o.type=type;if(vb)vib(o,t,d);o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);out(g);o.start(t);o.stop(t+d+.02);
    if(type==="square"){const o2=ac.createOscillator();o2.type="square";o2.detune.value=-14;o2.frequency.setValueAtTime(f,t);if(f2)o2.frequency.exponentialRampToValueAtTime(f2,t+d);o2.connect(g);o2.start(t);o2.stop(t+d+.02)}};
  const pad=(f,t,d,v,type="triangle")=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.3);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);out(g);o.start(t);o.stop(t+d+.02)}; // soft attack
  const saw=(f,t,d,v,c0=3200,c1=500,q=5)=>{const g=ac.createGain(),fl=ac.createBiquadFilter();fl.type="lowpass";fl.Q.value=q;
    fl.frequency.setValueAtTime(c0,t);fl.frequency.exponentialRampToValueAtTime(c1,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);
    g.gain.setValueAtTime(v,t+d*.55);g.gain.linearRampToValueAtTime(0,t+d);fl.connect(g);out(g);
    [-11,11].forEach(dt=>{const o=ac.createOscillator();o.type="sawtooth";o.frequency.value=f;o.detune.value=dt;o.connect(fl);o.start(t);o.stop(t+d+.02)})};
  const swish=(t,d=.16,v=.55)=>{const n=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=n.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;
    const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=n;fl.type="bandpass";fl.Q.value=2.2;

  const noise=(t,d,v=.4,freq=3000,type="bandpass")=>{const n=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=n.getChannelData(0);
    for(let i=0;i<a.length;i+=4){const r=Math.random()*2-1;a[i]=a[i+1]=a[i+2]=a[i+3]=r} // sample-hold = crunchier, 8-bit-ish
    const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=n;fl.type=type;fl.frequency.value=freq;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g);out(g);s.start(t)};
  const N=m=>440*2**((m-69)/12);

  const rnd=()=>SC[Math.random()*5|0]; // small random scale offset for tiny clicks
  const EM=[0,2,3,5,7,8,10],deg=i=>12*Math.floor(i/7)+EM[((i%7)+7)%7]; // natural minor, in scale steps

      PAN=0},
    complete(o={}){if(isKZ())return P.kzComplete(o);bus=bright;const t=ac.currentTime;step();const c=combo,E=64+(KEYS[o.col]??0),k=PROG[c%4],base=o.pan||0; // inspired by blinch
      AMB.E=E;AMB.k=k; // ambient follows the current key + chord

      let ai;do{ai=Math.random()*ARP.length|0}while(fam+ai===lastArp);lastArp=fam+ai;

      if(c>=6)ARP[ai].forEach((d,i)=>{PAN=base+(i%2?-.5:.5);tone(N(E+12+deg(k+d)),t+i*sp,.04,"triangle",.07)}); // layer 3: high octave

    sync(){const t=ac.currentTime;for(let i=0;i<6;i++)tone(N(69+[0,3,7,10,7,12][i]),t+i*.07,.07,"triangle",.3)},
  };
  // ambient: quiet ostinato + drone that follows the current key/chord, through the muffled bus
  const PAT=[0,4,7,4,2,4,7,4];
  const BASS=[0,0,12,0,0,12,0,12];
  function kzTick(n,t){ // synthwave bed: chord every 32 steps (i-VI-III-VII from the current chord)
    const cd=AMB.k+PROG[Math.floor(n/32)%4],root=AMB.E-24+deg(cd);
    if(n%2===0){PAN=0;saw(N(root+BASS[(n/2)%8]),t,.14,.05,1100,260,3)}                  // pulsing bass, 8ths
    if(n%32===0){[0,2,4].forEach((d,i)=>{PAN=(i-1)*.4;pad(N(AMB.E-12+deg(cd+d)),t,4.9,.032,"triangle")})} // pad
    if(n%2===1){PAN=(n%4===1)?-.35:.35;tone(N(AMB.E+deg(cd+[0,2,4,7][(n>>1)%4])),t,.12,"triangle",.018)} // soft arp
    if(n%4===2){PAN=.2;noise(t,.03,.025,9000,"highpass")}                                 // hats
    PAN=0}
  function tick(){if(!AMB.on||S.mute||!ac)return;const t=ac.currentTime+.05;bus=null;
    if(performance.now()-last>15000){AMB.k=0} // drift home to the tonic when idle
    const n=AMB.n=(AMB.n||0)+1;if(isKZ())return kzTick(n,t);if(n%2)return;
    const i=AMB.i++;PAN=i%2?.3:-.3;tone(N(AMB.E-12+deg(AMB.k+PAT[i%8])),t,.3,"triangle",.045);
    if(i%16===0){PAN=0;pad(N(AMB.E-24+deg(AMB.k)),t,4.8,.1);pad(N(AMB.E-12+deg(AMB.k+4)),t,4.8,.035,"sine")}
    PAN=0}
  return {
    play(n,o){if(S.mute)return;try{init();P[n](o)}catch(e){}bus=null;PAN=0},
    warm(){try{init();const g=[master.gain.value,bright.gain.value];master.gain.value=bright.gain.value=0;P.pick(); // a silent first note: the synth code gets compiled now
      setTimeout(()=>{master.gain.value=g[0];bright.gain.value=g[1]},180)}catch(e){}},
    ambient(on){AMB.on=on;clearInterval(AMB.id);if(on){try{init()}catch(e){return}AMB.i=0;AMB.n=0;AMB.id=setInterval(tick,150);tick()}},
  };
})();

/* ===== FX: pixel particles on a canvas overlay ===== */
const FX=(()=>{
  const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],texts=[],run=false;
  const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener("resize",fit);
  const G=3; // pixel grid
  let lastT=0,acc=0;
  const step=()=>{parts=parts.filter(p=>p.life-->0);for(const p of parts){p.vy+=p.g;p.vx*=.96;p.x+=p.vx;p.y+=p.vy}
    for(const t of texts){t.life--;if(t.life%3===0)t.y-=2}texts=texts.filter(t=>t.life>0)};
  function loop(now){
    acc+=Math.min(100,lastT?now-lastT:16.7);lastT=now;let n=0;while(acc>=16.7&&n<6){step();acc-=16.7;n++}
    cx.clearRect(0,0,cv.width,cv.height);
    for(const p of parts){if(p.flick&&Math.random()<.25)continue; // ember flicker
      const s=p.life<p.max*.35?G:p.s; cx.fillStyle=p.c;cx.fillRect(Math.round(p.x/G)*G,Math.round(p.y/G)*G,s,s)}
    cx.font='700 16px '+getComputedStyle(document.documentElement).getPropertyValue("--ff");cx.textAlign="center";
    for(const t of texts){const y=Math.round(t.y/2)*2;cx.globalAlpha=Math.min(1,t.life/15);cx.fillStyle="#1a0f05";cx.fillText(t.s,t.x+2,y+2);cx.fillStyle=t.c;cx.fillText(t.s,t.x,y);cx.globalAlpha=1}
    if(parts.length||texts.length)requestAnimationFrame(loop);else{run=false;lastT=0;acc=0}
  }
  const go=()=>{if(!run){run=true;requestAnimationFrame(loop)}};
  return{
    burst(x,y,colors,n=22){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3.5,m=26+Math.random()*24|0;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.2,g:.18,life:m,max:m,s:G*(1+(Math.random()*2|0)),c:colors[i%colors.length]})}
      for(let i=0;i<8;i++){const m=40+Math.random()*30|0;parts.push({x:x+(Math.random()-.5)*30,y,vx:(Math.random()-.5)*.6,vy:-.6-Math.random()*1.2,g:-.01,life:m,max:m,s:G,c:"#f3d48a",flick:true})}go()},
    dust(x,y,c){for(let i=0;i<10;i++){const d=i<5?-1:1,m=14+Math.random()*10|0;parts.push({x:x+d*Math.random()*20,y,vx:d*(1+Math.random()*2),vy:-Math.random()*1.2,g:.05,life:m,max:m,s:G,c})}go()},
    ash(x,y){for(let i=0;i<16;i++){const m=30+Math.random()*30|0;parts.push({x:x+(Math.random()-.5)*120,y:y+(Math.random()-.5)*20,vx:(Math.random()-.5),vy:-.4-Math.random(),g:-.005,life:m,max:m,s:G,c:["#5b4a7a","#3b2e55","#9b5a6e"][i%3],flick:true})}go()},
    rain(colors){for(let i=0;i<90;i++){const m=60+Math.random()*60|0;parts.push({x:Math.random()*innerWidth,y:-10-Math.random()*200,vx:(Math.random()-.5),vy:1+Math.random()*2,g:.05,life:m,max:m,s:G*2,c:colors[i%colors.length]})}go()},
    text(x,y,s,c="#f3d48a"){texts.push({x,y,s,c,life:45});go()},
  };
})();

    const lv=(d,cur,t1,t2)=>{const a=Math.abs(d);let l=Math.abs(cur);
      if(l===0&&a>t1)l=1;else if(l>=1&&a<t1-3)l=0;
      if(l===1&&a>t2)l=2;else if(l===2&&a<t2-4)l=1;
      return l?l*Math.sign(d):0};
    let fb=null,fg=null,nb=0,ng=0,sx=0,sy=0;

      if(fb==null){fb=nb=e.beta;fg=ng=e.gamma}
      fb+=(e.beta-fb)*.2;fg+=(e.gamma-fg)*.2;     // smooth sensor noise
      nb+=(fb-nb)*.0015;ng+=(fg-ng)*.0015;        // how you usually hold it: adapts over ~10 s
      sx=lv(-(fg-ng),sx,10,22);                   // left edge away from you -> look further right (at you)
      sy=lv(fb-nb,sy,12,99);                      // tilt toward you -> look down; away from you -> look up ("showing it something")
      gaze(sy<0?-sx:sx,sy)};                      // while looking up, left/right follow the turn instead of mirroring it
    addEventListener("deviceorientation",ori);
    if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission) // iPhone asks once, on the first tap
      addEventListener("pointerdown",()=>DeviceOrientationEvent.requestPermission().catch(()=>{}),{once:true})}
  // in the desktop app, follow the cursor across the whole screen
  if(window.dock?.cursor)setInterval(async()=>{const c=await window.dock.cursor();if(c&&(!c.inside||document.elementFromPoint(c.x,c.y)?.tagName==="IFRAME"))look(c.x,c.y)},90);
  // samurai's headband tails flutter every few seconds
  setInterval(()=>{const sk=skinOf(S.eye);if(!sk.flutter||eyeBusy)return;[sk.flutter,null,sk.flutter,null].forEach((g,i)=>setTimeout(()=>{if(skinOf(S.eye)===sk&&!eyeBusy)drawEye(g||undefined)},i*160))},3500);

/* tasks delivered by an AI through the MCP server land in the Inbox */
const SRC_IN={yougile:"yg",notion:"nt",daily:"dl","дейлик":"dl",obsidian:"ob",claude:"ai",ai:"ai",calendar:"gc"};
const isDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"");
const clip=v=>String(v||"").trim().slice(0,300);
/* merge incoming subtasks by id / text; reorder=true keeps the incoming order (full list from YouGile) */
function mergeSubs(t,list,reorder=false){t.subtasks??=[];let n=0;const order=[];
  for(const it of list||[]){const text=clip(it?.text);if(!text&&!it?.id)continue;
    let x=(it.id&&t.subtasks.find(z=>z.id===it.id))||t.subtasks.find(z=>normTxt(z.text)===normTxt(text));
    if(!x){x={id:newSid(t),text,done:false};t.subtasks.push(x);n++}else if(text)x.text=text;
    if(it.done!=null)x.done=!!it.done;
    if(it.due!==undefined)x.due=isDate(it.due)?it.due:undefined;
    if(Array.isArray(it.assignees))x.assignees=it.assignees.map(String).filter(Boolean);
    if(/^https?:\/\//i.test(it.url||""))x.url=String(it.url);
    order.push(x)}
  if(reorder&&order.length)t.subtasks=[...order,...t.subtasks.filter(z=>!order.includes(z))];
  return n}
/* the avatar pops when tapped or reskinned */
function bump(){const l=$("#logoSpr");l.classList.remove("bump");void l.offsetWidth;l.classList.add("bump")}
function setDone(x,v){if(typeof SYNC!=="undefined")SYNC.holdAt=Date.now();if(!x)return;if(x.col){if(!!x.done!==v){x.done=v;x.doneAt=v?Date.now():null;S.xp=Math.max(0,(S.xp||0)+(v?1:-1))}}else x.done=v}
/* find by {id} / {external_id} / {text} (exact after normalising; tasks first, then subtasks) */
function findTask(m){if(!m)return null;if(m.id){const x=findAny(String(m.id));if(x)return x}
  const e=String(m.external_id||"").trim().toLowerCase();if(e){const t=S.tasks.find(z=>(z.ext||"").toLowerCase()===e);if(t)return t}
  if(m.text){const n=normTxt(m.text);const t=S.tasks.find(z=>normTxt(z.text)===n);if(t)return t;
    for(const z of S.tasks)for(const x of z.subtasks||[])if(normTxt(x.text)===n)return x}
  return null}
function applySet(x,set){if(set.text)x.text=clip(set.text);
  if("due" in set)x.due=isDate(set.due)?set.due:undefined;
  if(Array.isArray(set.assignees))x.assignees=set.assignees.map(String).filter(Boolean);
  if(set.done!=null)setDone(x,!!set.done);
  if(set.url&&/^https?:\/\//i.test(set.url))x.url=set.url;
  if(!x.col)return;
  if(COLS.some(c=>c.id===set.column)){x.col=set.column}
  if("description" in set)x.description=set.description?String(set.description).slice(0,4000):undefined;
  if(set.url&&/^https?:\/\//i.test(set.url))x.url=set.url;
  if(set.external_id)x.ext=String(set.external_id)}
/* add_tasks item: update the task with the same id / external_id, otherwise add (skipping text duplicates) */
function upsertTask(it){const ext=clip(it.external_id);const text=clip(it.text);
  let t=(it.id&&S.tasks.find(z=>z.id===it.id))||(ext&&S.tasks.find(z=>(z.ext||"").toLowerCase()===ext.toLowerCase()))||null,isNew=false;
  const url=/^https?:\/\//i.test(it.url||"")?String(it.url):undefined,col=COLS.some(c=>c.id===it.column)?it.column:null;
  if(!t){if(!text)return null;
    if(!ext&&[...S.tasks,...(S.archive||[])].some(z=>(url&&z.url===url)||normTxt(z.text)===normTxt(text)))return null; // already on the board
    t=T(col||"inbox",text,false,SRC_IN[String(it.source||"").toLowerCase()]||"ai","");t.from="ai";S.tasks.unshift(t);isNew=true}
  else{if(text)t.text=text;if(col)t.col=col;if(it.source&&SRC_IN[String(it.source).toLowerCase()])t.src=SRC_IN[String(it.source).toLowerCase()]}
  if(ext)t.ext=ext;if(url)t.url=url;
  if(it.due!==undefined)t.due=isDate(it.due)?it.due:undefined;
  if(it.description!==undefined)t.description=it.description?String(it.description).slice(0,4000):undefined;
  if(Array.isArray(it.assignees))t.assignees=it.assignees.map(String).filter(Boolean);
  if(Array.isArray(it.subtasks))mergeSubs(t,it.subtasks,true);
  if(it.done!=null)setDone(t,!!it.done);
  return isNew?"new":"upd"}
const plural=(n,a,b,c)=>n%10===1&&n%100!==11?a:(n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?b:c);
function importInbox(items){
  if(!Array.isArray(items))return 0;const r={new:0,upd:0,done:0,del:0,cal:0};
  for(const it of items){try{if(!it||typeof it!=="object")continue;const op=it.op||"add";
    if(op==="add"){const k=upsertTask(it);if(k)r[k]++}
    else if(op==="update"){const x=findTask(it.match);if(x){applySet(x,it.set||{});r.upd++}}
    else if(op==="complete"){for(const m of it.items||[]){const x=findTask(m);if(x){setDone(x,it.done!==false);r.done++}}}
    else if(op==="add_subtasks"){const x=findTask(it.match);if(x?.col){mergeSubs(x,it.subtasks);r.upd++}}
    else if(op==="delete"){for(const m of it.items||[]){const x=findTask(m);if(x){removeItem(x);r.del++}}}
    else if(op==="calendar"){S.cal??={};S.cal.mcp=normEvents(it.events);S.cal.mcpAt=Date.now();r.cal++}
  }catch(e){console.warn("inbox item failed",e)}}
  const n=r.new+r.upd+r.done+r.del+r.cal;
  if(n){save();render();SFX.play("sync");
    document.querySelectorAll(".col[data-col=inbox] .card").forEach((c,i)=>{if(i<r.new){const[x,y]=center(c);FX.burst(x,y,["#f0a07a","#fff4cf","#6fc3d9"],10)}});
    const parts=[r.new&&`+${r.new} ${plural(r.new,"задача","задачи","задач")}`,r.upd&&`обновил ${r.upd}`,r.done&&`отметил ${r.done}`,r.del&&`убрал ${r.del}`,r.cal&&"календарь обновлён"].filter(Boolean);
    toast("Клод: "+parts.join(", ")+" ✦")}
  return n}
